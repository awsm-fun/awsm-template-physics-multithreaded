<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>single-player-game-physics — Awsm · Box3D · wasm threads</title>

    <!-- COOP/COEP shim for static hosts (GitHub Pages) that can't send the
         headers `crossOriginIsolated` needs. Must run before the wasm bundle.
         No-op when the server already isolates the page (Trunk / `task dev`).
         The matching `copy-file` below lands it at the site root. -->
    <script src="coi-serviceworker.js"></script>
    <link data-trunk rel="copy-file" href="coi-serviceworker.js" />

    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0b0d12; color: #cdd3e0; font-family: system-ui, sans-serif; overflow: hidden; }
        /* The DOM (canvas + HUD) is built from Rust with Dominator — see
           src/main_thread.rs. These classes are the styling hooks it uses. */
        .canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .hud { position: fixed; top: 10px; left: 12px; right: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; opacity: 0.85; pointer-events: none; }
        .hud .key { color: #7fd1ff; }
        /* The colours of the stats panel and of its explanation in About. A
           lane is the GPU or a thread; each has one colour wherever it
           appears: the GPU orange, the render thread blue, the physics /
           game worker green, the main thread grey. */
        :root { --lane-gpu: #ffb469; --lane-renderer: #7fb7ff; --lane-sim: #7ddc9a; --lane-page: #aab4c5; --stats-num: #f1f6ff; --stats-text: #c9d7ee; --stats-dim: #9fb0cc; --stats-accent: #7fd1ff; --stats-warn: #ffc24d; --stats-bad: #ff6a5e; --stats-line: rgba(127, 209, 255, 0.16); }
        [data-lane="gpu"] { --lane: var(--lane-gpu); }
        [data-lane="renderer"] { --lane: var(--lane-renderer); }
        [data-lane="sim"] { --lane: var(--lane-sim); }
        [data-lane="page"] { --lane: var(--lane-page); }
        /* Stats panel (top right), filled by awsm-renderer-stats from the
           render worker's reports (src/stats.rs adds the physics group).
           Hidden by default; the bottom-left Stats chip toggles it. Opaque enough to
           read over a bright floor. */
        .stats { position: fixed; top: 10px; right: 12px; box-sizing: border-box; min-width: 330px; max-width: min(calc(100vw - 24px), 470px); max-height: calc(100vh - 80px); overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.6; white-space: pre; text-align: left; color: var(--stats-text); background: rgba(10, 14, 22, 0.86); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 8px; padding: 6px 8px; backdrop-filter: blur(8px); scrollbar-color: rgba(127, 209, 255, 0.35) transparent; }
        /* One group per thread: a header that is always there (a button: it
           toggles the rows under it), name left, headline number right.
           Where a name and its value do not fit on one line (a phone), the
           value goes to the next line, at the right edge. */
        .stats-group, .stats-row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
        /* (The space between a header's name and its value is there for
           screen readers only: kept from becoming a line of its own when the
           two wrap.) */
        .stats-group { width: 100%; padding: 1px 4px; border: 0; background: none; color: var(--stats-num); font: inherit; font-weight: 600; text-align: left; white-space: normal; cursor: pointer; }
        /* A faint line between one group and the next. */
        .stats-rows + .stats-group { margin-top: 2px; border-top: 1px solid var(--stats-line); padding-top: 3px; }
        .stats-group:hover, .stats-row:hover { background-color: rgba(127, 209, 255, 0.1); }
        .stats-group:focus-visible { outline: 1px solid var(--stats-accent); outline-offset: -1px; }
        /* A name on the left, its value at the right edge. A name wider than
           the panel on its own (the physics group's, on a phone) wraps. */
        .stats-name { white-space: pre-wrap; }
        .stats-value { flex: none; margin-left: auto; white-space: pre; text-align: right; }
        .stats-num { color: var(--stats-num); }
        .stats-unit { font-size: 11px; color: var(--stats-dim); }
        /* A lane's colour, on its group header and on its row of the frame
           budget. */
        .stats-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--lane); }
        /* A lane's share of the frame budget, in front of its value. */
        .stats-bar { display: inline-block; width: 40px; height: 4px; margin-right: 10px; vertical-align: middle; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.14); }
        .stats-bar > span { display: block; height: 100%; background: var(--stats-dim); }
        .stats-bar.stats-warn > span { background: var(--stats-warn); }
        .stats-bar.stats-over > span { background: var(--stats-bad); }
        /* A group's rows, shown while it is expanded. Each level of a
           breakdown is indented under a thin guide line and a little dimmer
           than the one above. */
        .stats-row { --guide: linear-gradient(var(--stats-line), var(--stats-line)); padding: 0 4px 0 calc(4px + 2ch); background-image: var(--guide); background-repeat: no-repeat; background-size: 1px 100%; background-position: calc(4px + 0.5ch) 0; }
        .stats-row.stats-nested { padding-left: calc(4px + 4ch); background-image: var(--guide), var(--guide); background-position: calc(4px + 0.5ch) 0, calc(4px + 2.5ch) 0; color: #b3c2dc; }
        .stats-row.stats-nested-2 { padding-left: calc(4px + 6ch); background-image: var(--guide), var(--guide), var(--guide); background-position: calc(4px + 0.5ch) 0, calc(4px + 2.5ch) 0, calc(4px + 4.5ch) 0; color: var(--stats-dim); }
        .stats-btn { position: fixed; bottom: 18px; left: 16px; z-index: 5; font: inherit; font-size: 12px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 999px; padding: 7px 18px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s ease, border-color 0.15s ease; }
        .stats-btn:hover { background: rgba(20, 30, 48, 0.75); border-color: rgba(127, 209, 255, 0.45); }
        .stats-btn.active { background: rgba(20, 30, 48, 0.85); border-color: rgba(127, 209, 255, 0.6); color: #e8edf7; }
        /* "what do these mean?": opens About on its Stats tab. */
        .stats-help { display: block; margin: 0 0 2px auto; padding: 0 4px; border: 0; border-radius: 4px; background: none; color: var(--stats-accent); font: inherit; font-size: 11px; cursor: pointer; }
        .stats-help:hover { text-decoration: underline; }
        .stats-help:focus-visible { outline: 1px solid var(--stats-accent); }
        /* Physics keeps missing the frames it should have simulated (the
           late-frames row and its group's header), or a lane is over the
           frame budget (its header). */
        .stats .stats-bad, .stats .stats-bad .stats-num, .stats .stats-bad .stats-unit { color: var(--stats-bad); font-weight: 700; }

        /* ── Settings button + modal (graphics controls) ────────────────────
           Bottom-right pill opens a modal with the resolution slider (the
           fill-rate lever) + the anti-aliasing menu (Off, SMAA, MSAA 4×, TAA
           and its upscaling presets). awsm-renderer-settings builds the modal,
           the reduced-quality notice and the "compiling pipelines" overlay
           with these classes; src/main_thread.rs adds the button. */
        .settings-btn { position: fixed; bottom: 18px; right: 16px; z-index: 5; font: inherit; font-size: 12px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 999px; padding: 7px 18px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s ease, border-color 0.15s ease; }
        .settings-btn:hover { background: rgba(20, 30, 48, 0.75); border-color: rgba(127, 209, 255, 0.45); }
        .settings-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(3px); }
        .settings-modal { position: relative; width: min(360px, 86vw); margin: 20px; padding: 22px 26px; color: #cfe0f5; background: rgba(13, 18, 28, 0.96); border: 1px solid rgba(127, 209, 255, 0.22); border-radius: 12px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5); }
        .settings-modal h2 { margin: 0 0 16px; font-size: 16px; letter-spacing: 0.05em; color: #e8edf7; text-align: center; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; }
        .settings-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #b9c6dd; }
        .settings-row .res-slider { width: 150px; accent-color: #7fd1ff; cursor: pointer; }
        .settings-toggle { width: 18px; height: 18px; accent-color: #7fd1ff; cursor: pointer; }
        .settings-select { font: inherit; font-size: 12.5px; color: #e8edf7; background: rgba(20, 30, 48, 0.85); border: 1px solid rgba(127, 209, 255, 0.35); border-radius: 6px; padding: 4px 8px; cursor: pointer; accent-color: #7fd1ff; }
        .settings-hint { margin: 16px 0 0; font-size: 11.5px; line-height: 1.5; color: #8fa3c4; }
        /* One-time reduced-quality notice (touch devices); shares the settings
           modal chrome, plus its own body text + OK button. */
        .notice-text { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #b9c6dd; }
        .notice-ok { display: block; margin: 0 auto; font: inherit; font-size: 13px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(20, 30, 48, 0.75); border: 1px solid rgba(127, 209, 255, 0.45); border-radius: 999px; padding: 7px 28px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
        .notice-ok:hover { background: rgba(30, 44, 68, 0.9); border-color: #7fd1ff; }

        /* ── About button + modal ─────────────────────────────────────────── */
        .about-btn { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 13px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 999px; padding: 7px 22px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s ease, border-color 0.15s ease; }
        .about-btn:hover { background: rgba(20, 30, 48, 0.75); border-color: rgba(127, 209, 255, 0.45); }
        .about-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(3px); }
        .about-overlay[hidden] { display: none; }
        /* At most 560px wide, never past the viewport; only the panel scrolls. */
        .about-modal { position: relative; display: flex; flex-direction: column; box-sizing: border-box; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); padding: 20px 24px 0; color: #cfe0f5; font-size: 14px; line-height: 1.6; background: rgba(13, 18, 28, 0.96); border: 1px solid rgba(127, 209, 255, 0.22); border-radius: 12px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5); }
        /* The title and, right under it, the link to the source: always in view. */
        .about-header { margin: 0 28px 12px 0; /* clear of the close button */ }
        .about-modal h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: 0.05em; color: #e8edf7; }
        .about-github { font-size: 13px; }
        .about-tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(127, 209, 255, 0.22); }
        .about-tab { padding: 6px 16px; font: inherit; color: #9fb4d8; background: none; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; }
        .about-tab:hover { color: #e8edf7; }
        .about-tab[aria-selected="true"] { color: #e8edf7; background: rgba(127, 209, 255, 0.1); border-color: rgba(127, 209, 255, 0.22); }
        .about-tab:focus-visible, .about-panel:focus-visible { outline: 2px solid #7fd1ff; outline-offset: -2px; }
        .about-panel { overflow-y: auto; scrollbar-color: rgba(127, 209, 255, 0.35) transparent; margin: 0 -24px; padding: 14px 24px 20px; }
        .about-modal p { margin: 0 0 12px; }
        .about-modal h3 { margin: 16px 0 6px; font-size: 13px; letter-spacing: 0.05em; color: #e8edf7; }
        .about-modal a { color: #7fd1ff; text-decoration: none; border-bottom: 1px solid rgba(127, 209, 255, 0.35); }
        .about-modal a:hover { border-bottom-color: #7fd1ff; }
        .about-modal code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #e8edf7; }
        /* Key → what it does: the same look as a term and its description
           below. */
        .about-keys { width: 100%; margin: 0 0 12px; border-collapse: collapse; }
        .about-keys th, .about-keys td { padding: 4px 0; text-align: left; vertical-align: top; }
        .about-keys th { width: 42%; padding-right: 16px; font-weight: 600; color: var(--stats-accent); }
        .about-keys td, .about-modal dd { color: #b9c7de; }
        /* The Stats tab. Each section is a group of the panel: a divider, the
           group's name with its lane's dot, then its terms. */
        #about-panel-stats h3 { margin-top: 18px; border-top: 1px solid var(--stats-line); padding-top: 14px; }
        .about-modal h3[data-lane]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--lane); }
        /* A term from the panel, then what it means: side by side where there
           is room, one under the other on a phone. */
        .about-modal dl { margin: 0 0 12px; }
        .about-modal dt { font-weight: 600; color: var(--stats-accent); }
        .about-modal dd { margin: 2px 0 12px; }
        @media (min-width: 560px) { .about-modal dl { display: grid; grid-template-columns: minmax(0, 11.5em) minmax(0, 1fr); gap: 10px 18px; } .about-modal dd { margin: 0; } }
        /* A unit as the panel prints it. */
        .about-unit { display: inline-block; padding: 0 8px; border: 1px solid var(--stats-line); border-radius: 999px; background: rgba(127, 209, 255, 0.08); font-size: 12px; color: #e8edf7; white-space: nowrap; }
        .about-more { color: #9fb4d8; }
        .about-close { position: absolute; top: 10px; right: 12px; font-size: 20px; line-height: 1; color: #9fb4d8; background: none; border: none; cursor: pointer; padding: 4px 8px; }
        .about-close:hover { color: #e8edf7; }

        /* ── Loading screen ─────────────────────────────────────────────────
           Present in the static HTML so it shows the moment the page arrives
           (while the wasm is still downloading/compiling). Rust appends
           progress lines to #loading-log and removes the overlay on Ready. */
        #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(120% 120% at 50% 20%, #141a26 0%, #0b0d12 60%, #06070a 100%); transition: opacity 0.5s ease; }
        #loading.done { opacity: 0; pointer-events: none; }
        #loading .title { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #e8edf7; text-align: center; line-height: 1.5; }
        #loading .title b { color: #ff6a5e; font-weight: 600; }
        #loading .subtitle { display: block; margin-top: 6px; font-size: 13px; letter-spacing: 0.3em; color: #7f8ba1; }
        #loading .orb { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #ffffff 0%, #b8c4d6 18%, #2a3242 70%, #0b0d12 100%); box-shadow: 0 0 24px rgba(127, 209, 255, 0.35); animation: loading-bounce 1.1s cubic-bezier(0.28, 0, 0.55, 1) infinite alternate; }
        @keyframes loading-bounce { from { transform: translateY(-16px) scale(1); } to { transform: translateY(10px) scale(0.94, 1.06); } }
        #loading-log { width: min(620px, 86vw); height: 200px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.6; color: #7f8ba1; mask-image: linear-gradient(to bottom, transparent 0%, black 35%); }
        #loading-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #loading-log div:last-child { color: #b9e3ff; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="orb"></div>
        <div class="title">
            <div><b>Awsm</b> Renderer and Audio</div>
            <div><b>Box3D</b> Physics</div>
            <span class="subtitle">wasm threads</span>
        </div>
        <div id="loading-log"><div>loading code… (fetching + compiling the wasm bundle)</div></div>
    </div>
    <!-- wasm-opt is disabled (data-wasm-opt="0"): the threaded build emits
         atomics + bulk-memory + a shared-memory import, which the wasm-opt
         Trunk bundles can silently strip. Keeping it off preserves the
         shared-memory bootstrap. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <!-- Vendored Basis TRANSCODER + its worker (runtime KTX2/BasisU texture
         load — the editor bakes material textures as Basis-supercompressed
         KTX2 by default). The codec crate has NO built-in URLs: the frontend
         provides them via `configure(BasisWorkerConfig::player(worker_url,
         transcoder_url))` (see render_thread.rs), pointing at these copied
         files — served same-origin at the APP origin (COEP require-corp demands
         it anyway; the render worker builds ABSOLUTE URLs from that origin
         since its own base is `blob:`). Change the paths below and the two
         `format!` URLs in render_thread.rs together. The ENCODER is editor-only
         — never ship it in a player. See web/vendor/basis/. -->
    <link data-trunk rel="copy-file" href="../../web/vendor/basis/basis_transcoder.js" data-target-path="vendor/basis" />
    <link data-trunk rel="copy-file" href="../../web/vendor/basis/basis_transcoder.wasm" data-target-path="vendor/basis" />
    <link data-trunk rel="copy-file" href="../../web/workers/basis-worker.js" data-target-path="workers" />

    <!-- Bundle the editor-exported scene SAME-ORIGIN. COEP `require-corp`
         blocks cross-origin fetches, so the render worker must load the scene
         from our own origin. `media/bundle` is the scene editor's player
         export — `scene.toml` (table + walls + ball, with collider nodes the
         physics thread derives its Box3D world from) plus its `assets/`
         (environment KTX2 cubemaps, PBR textures, and any imported-mesh
         glbs). copy-dir serves the whole export at `/bundle/...`; the render
         worker fetches `bundle/scene.toml`, then its `HttpAssets` pulls
         `bundle/assets/<id>.ktx2|png|...` on demand as the player loader
         requests them. -->
    <link data-trunk rel="copy-dir" href="../../media/bundle" />

    <!-- The awsm-audio export (project.toml + assets/*.wav + the rolling-sound
         .wasm worklet), served same-origin at `/audio/...` for the same COEP
         reason. The main thread fetches + plays it. -->
    <link data-trunk rel="copy-dir" href="../../media/audio" />
</body>
</html>
